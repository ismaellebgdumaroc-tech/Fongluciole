# Memoire : -Xmx3G est la valeur du MDK officiel (decompilation de Minecraft). Rien n'est augmente ici.
# SerialGC : moins de surcharge memoire que G1 et pas de blocs humongous (gros tableaux) qui peuvent saturer le tas.
org.gradle.jvmargs=-Xmx3G -XX:+UseSerialGC
org.gradle.daemon=false
# Une seule tache / un seul worker a la fois : evite d'additionner la memoire de plusieurs taches lourdes.
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=false
org.gradle.configureondemand=false
org.gradle.vfs.watch=false

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.2.0
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

